<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FridgeScan">
<title>FridgeScan</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');
:root{--cream:#FFF8E7;--red:#E63946;--blue:#457B9D;--yellow:#F4D03F;--green:#2ECC71;--orange:#E67E22;--dark:#2C3E50}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#b0c4de;background-image:repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(255,255,255,.15) 39px,rgba(255,255,255,.15) 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(255,255,255,.15) 39px,rgba(255,255,255,.15) 40px);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:20px 16px 40px;font-family:'Nunito',sans-serif}
.magnet-wrap{width:100%;max-width:390px}
.magnet{background:var(--cream);border-radius:20px;padding:20px;box-shadow:0 2px 0 #c8b89a,0 4px 0 #b8a88a,0 6px 0 #a89878,0 8px 20px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.8);position:relative;border:3px solid #d4c4a0}
.magnet::before{content:'';position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:64px;height:14px;background:linear-gradient(to bottom,#c0392b,#e74c3c);border-radius:8px 8px 0 0;box-shadow:0 -2px 4px rgba(0,0,0,.2)}
.title{font-family:'Fredoka One',cursive;font-size:1.7rem;color:var(--red);text-align:center;margin-bottom:2px}
.sub{font-size:.72rem;color:#999;text-align:center;margin-bottom:14px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px}
.scanner-box{background:#111;border-radius:14px;overflow:hidden;position:relative;width:100%;aspect-ratio:1/1;margin-bottom:14px;border:3px solid #333}
#reader{width:100%;height:100%;position:relative}
#reader video{width:100%!important;height:100%!important;object-fit:cover!important}
.placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#666;background:#111;z-index:2;pointer-events:none}
.placeholder span{font-size:2.8rem}
.placeholder p{font-size:.8rem;font-weight:700;color:#888;text-align:center;padding:0 20px;line-height:1.5}
.corner{position:absolute;width:24px;height:24px;border-color:var(--yellow);border-style:solid;z-index:5;pointer-events:none;opacity:0;transition:opacity .3s}
.corner.tl{top:14px;left:14px;border-width:3px 0 0 3px;border-radius:4px 0 0 0}
.corner.tr{top:14px;right:14px;border-width:3px 3px 0 0;border-radius:0 4px 0 0}
.corner.bl{bottom:14px;left:14px;border-width:0 0 3px 3px;border-radius:0 0 0 4px}
.corner.br{bottom:14px;right:14px;border-width:0 3px 3px 0;border-radius:0 0 4px 0}
.scanning .corner{opacity:1}
.scan-lbl{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:var(--yellow);font-size:.68rem;font-weight:800;padding:4px 14px;border-radius:20px;z-index:10;text-transform:uppercase;letter-spacing:1px;white-space:nowrap;opacity:0;transition:opacity .3s}
.scanning .scan-lbl{opacity:1}
.btn-row{display:flex;gap:8px;margin-bottom:12px}
.btn{flex:1;padding:13px 8px;border:none;border-radius:12px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;box-shadow:0 4px 0 rgba(0,0,0,.2);-webkit-appearance:none;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn-scan{background:var(--red);color:#fff}
.btn-stop{background:#444;color:#fff}
.btn-type{background:var(--blue);color:#fff}
.manual{display:none;margin-bottom:12px;gap:8px}
.manual.on{display:flex}
input[type=text],input[type=date]{flex:1;padding:11px 12px;border:2.5px solid #ddd;border-radius:10px;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:700;background:#fff;outline:none;-webkit-appearance:none;color:#333}
input:focus{border-color:var(--blue)}
.go-btn{padding:11px 16px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-weight:800;font-size:.85rem;font-family:'Nunito',sans-serif;cursor:pointer;-webkit-appearance:none}
.status{font-size:.8rem;font-weight:700;text-align:center;padding:8px 12px;border-radius:8px;margin-bottom:10px;display:none;line-height:1.4}
.status.on{display:block}
.status.loading{background:#e8f4fd;color:var(--blue)}
.status.error{background:#fdecea;color:#c0392b}
.status.success{background:#d5f5e3;color:#1e8449}
.product-card{display:none;background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;border:2.5px solid #eee}
.product-card.on{display:block;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
.prod-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.prod-img{width:58px;height:58px;border-radius:10px;background:#f5f5f5;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:2rem;overflow:hidden}
.prod-img img{width:100%;height:100%;object-fit:cover}
.prod-name{font-family:'Fredoka One',cursive;font-size:1rem;color:var(--dark);line-height:1.2}
.prod-brand{font-size:.72rem;color:#aaa;font-weight:700;margin-top:3px}
.prod-code{font-size:.65rem;color:#ccc;font-family:monospace;margin-top:2px}
.exp-box{background:#fffbf0;border:2px dashed #e0d5b0;border-radius:10px;padding:10px 12px}
.exp-lbl{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#bbb;margin-bottom:6px}
.exp-row{display:flex;gap:8px;align-items:center}
.save-btn{padding:11px 14px;background:var(--green);color:#fff;border:none;border-radius:10px;font-weight:800;font-size:.8rem;font-family:'Nunito',sans-serif;cursor:pointer;white-space:nowrap;-webkit-appearance:none}
.list-hdr{font-family:'Fredoka One',cursive;font-size:1rem;color:var(--dark);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.cpill{background:#e8e8e8;color:#777;font-size:.68rem;padding:2px 9px;border-radius:20px;font-family:'Nunito',sans-serif;font-weight:800}
.items{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.item{background:#fff;border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;border:2px solid #eee;animation:pop .2s ease}
.i-left{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.i-emoji{font-size:1.3rem;flex-shrink:0}
.i-name{font-weight:800;font-size:.82rem;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.i-date{font-size:.68rem;color:#bbb;font-weight:600}
.i-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:.7rem;font-weight:800;text-transform:uppercase}
.good{background:#d5f5e3;color:#1e8449}
.soon{background:#fef9c3;color:#b7950b}
.gone{background:#fdecea;color:#c0392b}
.del{background:none;border:none;font-size:.9rem;opacity:.35;cursor:pointer;padding:4px}
.del:active{opacity:1}
.empty{text-align:center;color:#ccc;font-size:.82rem;font-weight:700;padding:22px 0}
.tip{background:#fff3cd;border:2px solid #ffc107;border-radius:10px;padding:9px 12px;font-size:.72rem;font-weight:600;color:#856404;margin-bottom:12px;line-height:1.5}
</style>
</head>
<body>
<div class="magnet-wrap">
 <div class="magnet">
  <div class="title">🧲 FridgeScan</div>
  <div class="sub">Barcode Expiry Tracker</div>
  <div class="tip">📌 Barcodes identify the <strong>product</strong> — you enter the printed expiry date once, then FridgeScan tracks it!</div>
  <div class="scanner-box" id="scannerBox">
   <div class="placeholder" id="placeholder"><span>📷</span><p>Tap <strong>Scan Barcode</strong><br>to open your camera</p></div>
   <div id="reader"></div>
   <div class="corner tl"></div><div class="corner tr"></div>
   <div class="corner bl"></div><div class="corner br"></div>
   <div class="scan-lbl">🔍 Point at barcode…</div>
  </div>
  <div class="btn-row">
   <button class="btn btn-scan" id="btnScan" onclick="toggleScan()">📷 Scan Barcode</button>
   <button class="btn btn-type" onclick="toggleManual()">⌨️ Type Code</button>
  </div>
  <div class="manual" id="manual">
   <input type="text" id="codeInput" placeholder="Enter barcode number…" maxlength="20" inputmode="numeric">
   <button class="go-btn" onclick="doLookup()">Go</button>
  </div>
  <div class="status" id="status"></div>
  <div class="product-card" id="productCard">
   <div class="prod-head">
    <div class="prod-img" id="prodImg">🥫</div>
    <div style="min-width:0">
     <div class="prod-name" id="prodName"></div>
     <div class="prod-brand" id="prodBrand"></div>
     <div class="prod-code" id="prodCode"></div>
    </div>
   </div>
   <div class="exp-box">
    <div class="exp-lbl">📅 Expiry date (from package)</div>
    <div class="exp-row">
     <input type="date" id="expDate">
     <button class="save-btn" onclick="saveItem()">+ Save</button>
    </div>
   </div>
  </div>
  <div class="list-hdr">🧊 In the Fridge <span class="cpill" id="cnt">0</span></div>
  <div class="items" id="itemList"></div>
 </div>
</div>
<script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
<script>
const EMOJIS=['🥫','🧀','🥩','🥛','🍎','🥦','🫙','🍕','🥚','🧁','🍞','🥗','🧆','🥜','🫐'];
let items=JSON.parse(localStorage.getItem('fs_v2')||'[]');
let scanning=false,reader=null,current=null;
function rEmoji(){return EMOJIS[Math.floor(Math.random()*EMOJIS.length)]}
function persist(){localStorage.setItem('fs_v2',JSON.stringify(items))}
function setStatus(msg,type){const s=document.getElementById('status');s.textContent=msg;s.className='status on '+type;if(type==='success')setTimeout(()=>s.classList.remove('on'),2500);}
function clearStatus(){document.getElementById('status').classList.remove('on')}
function toggleManual(){document.getElementById('manual').classList.toggle('on');setTimeout(()=>document.getElementById('codeInput').focus(),100);}
async function toggleScan(){if(scanning){stopScan();return}await startScan();}
async function startScan(){
  try{
    reader=new ZXing.BrowserMultiFormatReader();
    const devices=await ZXing.BrowserMultiFormatReader.listVideoInputDevices();
    if(!devices.length){setStatus('No camera found — use Type Code instead','error');return}
    let devId=devices[0].deviceId;
    for(const d of devices){const lbl=d.label.toLowerCase();if(lbl.includes('back')||lbl.includes('rear')||lbl.includes('environment')){devId=d.deviceId;break}}
    document.getElementById('placeholder').style.display='none';
    document.getElementById('scannerBox').classList.add('scanning');
    document.getElementById('btnScan').textContent='⏹ Stop';
    document.getElementById('btnScan').className='btn btn-stop';
    scanning=true;
    await reader.decodeFromVideoDevice(devId,'reader',(result,err)=>{if(result){const code=result.getText();stopScan();lookupCode(code);}});
  }catch(e){
    stopScan();
    if(e.name==='NotAllowedError'){setStatus('Camera denied — go to Settings > Safari > Camera > Allow','error');}
    else{setStatus('Camera error — use Type Code instead','error');}
  }
}
function stopScan(){
  if(reader){try{reader.reset()}catch(e){}}
  reader=null;scanning=false;
  document.getElementById('placeholder').style.display='flex';
  document.getElementById('scannerBox').classList.remove('scanning');
  document.getElementById('btnScan').innerHTML='📷 Scan Barcode';
  document.getElementById('btnScan').className='btn btn-scan';
  const v=document.getElementById('reader').querySelector('video');
  if(v){try{v.srcObject&&v.srcObject.getTracks().forEach(t=>t.stop())}catch(e){}v.remove()}
}
function doLookup(){const v=document.getElementById('codeInput').value.trim();if(v)lookupCode(v);}
async function lookupCode(code){
  setStatus('🔍 Looking up product…','loading');
  hideCard();
  try{
    const res=await fetch(`https://world.openfoodfacts.org/api/v0/product/${code}.json`);
    const data=await res.json();
    let name='Unknown Product',brand='',imgUrl='';
    if(data.status===1&&data.product){const p=data.product;name=p.product_name||p.product_name_en||'Unknown Product';brand=p.brands||'';imgUrl=p.image_front_small_url||p.image_url||'';clearStatus();}
    else{setStatus(`Code ${code} not in database — fill in manually`,'error');}
    current={code,name,brand,imgUrl,emoji:rEmoji()};
    showCard(current);
  }catch(e){setStatus('Lookup failed — check connection','error');}
}
function showCard(p){
  document.getElementById('prodName').textContent=p.name;
  document.getElementById('prodBrand').textContent=p.brand;
  document.getElementById('prodCode').textContent=p.code;
  const img=document.getElementById('prodImg');
  if(p.imgUrl){img.innerHTML=`<img src="${p.imgUrl}" onerror="this.parentElement.textContent='${p.emoji}'">`}else{img.textContent=p.emoji}
  const d=new Date();d.setDate(d.getDate()+7);
  document.getElementById('expDate').value=d.toISOString().split('T')[0];
  document.getElementById('productCard').classList.add('on');
}
function hideCard(){document.getElementById('productCard').classList.remove('on')}
function saveItem(){
  if(!current)return;
  const exp=document.getElementById('expDate').value;
  if(!exp){setStatus('Please pick an expiry date','error');return}
  items.unshift({id:Date.now(),...current,expDate:exp});
  persist();renderList();hideCard();current=null;
  setStatus('✅ Saved to fridge!','success');
}
function deleteItem(id){items=items.filter(i=>i.id!==id);persist();renderList();}
function daysLeft(d){const t=new Date();t.setHours(0,0,0,0);const e=new Date(d+'T00:00:00');e.setHours(0,0,0,0);return Math.round((e-t)/86400000);}
function renderList(){
  const el=document.getElementById('itemList');
  document.getElementById('cnt').textContent=items.length;
  if(!items.length){el.innerHTML='<div class="empty">Nothing here yet — scan something! 🥦</div>';return}
  const s=[...items].sort((a,b)=>new Date(a.expDate)-new Date(b.expDate));
  el.innerHTML=s.map(i=>{const d=daysLeft(i.expDate);const cls=d<0?'gone':d<=3?'soon':'good';const lbl=d<0?'⚠️ Expired':d===0?'⏰ Today!':d<=3?`⏰ ${d}d left`:`✅ ${d}d`;const ds=new Date(i.expDate+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'});return`<div class="item"><div class="i-left"><span class="i-emoji">${i.emoji}</span><div style="min-width:0"><div class="i-name">${i.name}</div><div class="i-date">Exp: ${ds}</div></div></div><div class="i-right"><span class="badge ${cls}">${lbl}</span><button class="del" onclick="deleteItem(${i.id})">🗑️</button></div></div>`;}).join('');
}
document.getElementById('codeInput').addEventListener('keydown',e=>{if(e.key==='Enter')doLookup()});
renderList();
</script>
</body>
</html>
